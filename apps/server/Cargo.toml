[package]
name = "pfe-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "pfe-server"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic", "metrics", "trace"] }
parquet = { version = "60.0.0", default-features = false, features = ["snap"] }
prost = "0.14"
rdkafka = { version = "0.39.0", default-features = false, features = ["tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tonic = { version = "0.14", features = ["gzip"] }
tonic-health = "0.14"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v7"] }

[build-dependencies]
prost-build = "0.14.4"
protoc-bin-vendored = "3.3.0"

[lints]
workspace = true

[dev-dependencies]
tokio-stream = { version = "0.1", features = ["net"] }
