[package]
name = "recount"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"

[target.'cfg(target_os = "linux")'.dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
nix = { version = "0.32.0", features = ["signal", "process", "fs", "user", "dir"] }
recount-execution-claims = { version = "0.1.0", path = "../../crates/execution-claims" }
recount-telemetry-schema = { version = "0.1.0", path = "../../crates/telemetry-schema" }
uuid = { version = "1.29.2", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile = "3.27.0"
