[package]
name = "recount"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"

[target."cfg(unix)".dependencies]
clap = { version = "4.6.7", features = ["derive"] }
recount-telemetry-schema = { version = "0.1.0", path = "../../crates/telemetry-schema" }
recount-telemetry-validation = { version = "0.1.0", path = "../../crates/telemetry-validation" }
serde_json = "1.0.154"
