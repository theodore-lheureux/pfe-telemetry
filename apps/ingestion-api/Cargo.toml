[package]
name = "recount-ingestion-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
deadpool-postgres = "0.14.2"
ed25519-dalek = "3.0.0"
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic", "metrics"] }
prost = "0.14.4"
rdkafka = { version = "0.39.0", default-features = false, features = ["tokio"] }
recount-telemetry-schema = { version = "0.1.0", path = "../../crates/telemetry-schema" }
recount-telemetry-validation = { version = "0.1.0", path = "../../crates/telemetry-validation" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tokio-postgres = { version = "0.7.18", features = ["with-uuid-1"] }
tokio-postgres-rustls = { version = "0.14.0", features = ["ring", "webpki-roots"] }
tonic = { version = "=0.14.6", features = ["gzip"] }
tonic-health = "=0.14.6"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v7"] }

[lints]
workspace = true

[dev-dependencies]
tokio-stream = { version = "0.1.19", features = ["net"] }
