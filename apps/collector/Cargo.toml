[package]
name = "recount-collector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic", "metrics"] }
procfs = { version = "0.18", default-features = false }
prost = "0.14"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tonic = { version = "0.14", features = ["gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
tonic-types = "0.14.6"
recount-telemetry-validation = { version = "0.1.0", path = "../../crates/telemetry-validation" }
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite-bundled", "runtime-tokio"] }
nix = { version = "0.31.3", default-features = false, features = ["net", "socket"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["client-legacy", "tokio"] }
tower = { version = "0.5.3", features = ["util"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
ed25519-dalek = "3.0.0"
base64 = "0.23.1"
serde_json = "1.0.154"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }

[lints]
workspace = true

[dependencies]
uuid = { version = "1.28.0", features = ["serde", "v4", "v7"] }
