[package]
name = "recount-collector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
procfs = { version = "0.18", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tonic-types = "0.14.6"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite-bundled", "runtime-tokio"] }
nix = { version = "0.31.3", default-features = false, features = ["net", "socket"] }
recount-telemetry-schema = { version = "0.1.0", path = "../../crates/telemetry-schema" }
recount-nvidia-dcgm = { version = "0.1.0", path = "../../crates/nvidia-dcgm" }
nvml-wrapper = "0.13.0"

[target.'cfg(target_os = "linux")'.dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "crypto"] }

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
hyper-util = { version = "0.1.21", default-features = false, features = ["client-legacy", "tokio"] }
opentelemetry-proto = { version = "0.33", default-features = false, features = ["gen-tonic", "metrics", "with-serde"] }
prost = "0.14"
recount-telemetry-validation = { version = "0.1.0", path = "../../crates/telemetry-validation" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tonic = { version = "0.14", features = ["gzip", "tls-native-roots", "tls-ring", "tls-webpki-roots"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1"
uuid = { version = "1.28.0", features = ["serde", "v4", "v7"] }
