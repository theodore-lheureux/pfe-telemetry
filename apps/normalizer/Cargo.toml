[package]
name = "recount-normalizer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
prost = { version = "=0.14.4", default-features = false, features = ["derive", "std"] }
rdkafka = { version = "=0.39.0", default-features = false, features = ["tokio"] }
recount-telemetry-schema = { version = "0.1.0", path = "../../crates/telemetry-schema" }
recount-telemetry-validation = { version = "0.1.0", path = "../../crates/telemetry-validation" }
ruststream = { version = "=0.7.7", default-features = false, features = ["macros", "json"] }
ruststream-rdkafka = { version = "=0.7.1", default-features = false }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt"] }
