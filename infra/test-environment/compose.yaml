name: pfe-telemetry-test

services:
  ingestion:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    ports:
      - "127.0.0.1:${TEST_ENV_HOST_PORT:-8088}:4317"
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "grpc_health_probe",
          "-addr=127.0.0.1:4317",
          "-service=grpc.health.v1.Health",
          "-connect-timeout=2s",
          "-rpc-timeout=2s",
        ]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=6h
      - --storage.tsdb.retention.size=256MB
      - --web.enable-remote-write-receiver
    ports:
      - "127.0.0.1:${TEST_ENV_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.25
    mem_limit: 256m
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:9090/-/ready]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "3"

  grafana:
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    ports:
      - "127.0.0.1:${TEST_ENV_GRAFANA_PORT:-3003}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_LOG_LEVEL: warn
      GOMEMLIMIT: 768MiB
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      prometheus:
        condition: service_healthy
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1
    mem_limit: 1g
    pids_limit: 512
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:3000/api/health]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "3"

volumes:
  prometheus-data:
  grafana-data:
