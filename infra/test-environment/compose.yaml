name: pfe-telemetry-test

services:
  ingestion:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    ports:
      - "127.0.0.1:${TEST_ENV_HOST_PORT:-8088}:4317"
    user: "10001:10001"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 64
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "grpc_health_probe",
          "-addr=127.0.0.1:4317",
          "-service=grpc.health.v1.Health",
          "-connect-timeout=2s",
          "-rpc-timeout=2s",
        ]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "3"
