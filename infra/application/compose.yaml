name: pfe-application

services:
  postgres:
    image: postgres:18.6-trixie@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    environment:
      POSTGRES_USER: pfe
      POSTGRES_DB: pfe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/application/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    networks:
      default:
      credentials:
        aliases: [credential-postgres]
    volumes:
      - postgres-data:/var/lib/postgresql
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready --username=pfe --dbname=pfe"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "3"

volumes:
  postgres-data:

networks:
  credentials:
    name: ${PFE_CREDENTIAL_NETWORK_NAME:-pfe-credential-authority}
    internal: true
