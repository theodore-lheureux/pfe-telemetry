- name: Configure temporary collectors
  hosts: demo
  become: true
  gather_facts: false
  serial: "{{ demo_setup_batch_size | default(5) }}"
  vars:
    recount_endpoint: https://ingest.recount.cloud
    recount_enrollment_url: https://app.recount.cloud
    recount_state: /var/lib/recount-collector
  tasks:
    - name: Wait for the selected connection
      ansible.builtin.wait_for_connection:
        timeout: 180
        connect_timeout: 10
      no_log: true
    - name: Read collector platform facts
      ansible.builtin.setup:
        gather_subset: [hardware, distribution, service_mgr]
    - name: Configure the collector without crossing projects
      block:
        - ansible.builtin.include_tasks: tasks/collector-config.yml
      rescue:
        - name: Preserve the incomplete configuration receipt
          ansible.builtin.copy:
            dest: "{{ recount_lab_directory }}/{{ inventory_hostname }}.json"
            content: "{{ {'phase': 'uncertain', 'project_id': recount_expected_project_id} | to_nice_json }}"
            mode: "0600"
          delegate_to: localhost
          become: false
        - ansible.builtin.fail:
            msg: Configuration stopped; reconcile this collector before retrying. Queued telemetry remains in its original project.
      always:
        - name: Remove the temporary enrollment key
          ansible.builtin.file:
            path: /etc/recount-collector/enrollment.key
            state: absent
