- name: Wait for the selected AWS node's startup management update
  when: demo_cloud == 'aws-cpu' and not (demo_skip_individual_ssm | default(false) | bool)
  ansible.builtin.command:
    argv:
      - "{{ ansible_playbook_python }}"
      - "{{ playbook_dir }}/ssm_ready.py"
      - "{{ demo_collector.instance_id }}"
      - "{{ demo_config.aws.region }}"
      - "{{ demo_config.aws.startup_ssm_document | default('') }}"
  environment: "{{ demo_environment }}"
  register: demo_ssm_startup
  until: demo_ssm_startup.rc == 0
  retries: 36
  delay: 5
  changed_when: false

- name: Add the AWS collector through SSM
  when: demo_cloud == 'aws-cpu'
  ansible.builtin.add_host:
    name: "{{ demo_collector.name }}"
    groups: demo
    ansible_host: "{{ demo_collector.instance_id }}"
    ansible_connection: amazon.aws.aws_ssm
    ansible_aws_ssm_profile: recount-demo
    ansible_aws_ssm_access_key_id: ""
    ansible_aws_ssm_secret_access_key: ""
    ansible_aws_ssm_session_token: ""
    ansible_aws_ssm_region: "{{ demo_config.aws.region }}"
    ansible_aws_ssm_bucket_name: "{{ demo_config.aws.transfer_bucket }}"
    ansible_aws_ssm_bucket_sse_mode: AES256
    ansible_python_interpreter: /usr/bin/python3
    recount_arch: arm64
    recount_gpu: false
  no_log: true

- name: Verify the GCP guest host key and add its SSH inventory
  when: demo_cloud == 'gcp-gpu'
  ansible.builtin.include_tasks: host-gcp.yml
