- name: Create private worker and checkpoint directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop: [/usr/local/lib/recount-demo, /var/lib/recount-demo-load]

- name: Install the fixed workload implementation
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/lib/recount-demo/{{ item }}"
    mode: "0600"
  loop: [recount_demo_load.py, cpu_load.py, gpu_load.py]

- name: Install the bounded worker service
  ansible.builtin.template:
    src: workload.service.j2
    dest: /etc/systemd/system/recount-demo-load.service
    mode: "0644"

- name: Start the job without enabling restart on boot
  ansible.builtin.systemd_service:
    name: recount-demo-load
    state: started
    enabled: false
    daemon_reload: true
