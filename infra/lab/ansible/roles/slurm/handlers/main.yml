---
- name: Restart lab Munge
  ansible.builtin.systemd_service:
    name: munge
    state: restarted

- name: Restart the lab controller
  ansible.builtin.systemd_service:
    name: slurmctld
    state: restarted
  when: inventory_hostname == 'node1'
  listen: Restart lab Slurm

- name: Restart the lab compute daemons
  ansible.builtin.systemd_service:
    name: slurmd
    state: restarted
  listen: Restart lab Slurm
