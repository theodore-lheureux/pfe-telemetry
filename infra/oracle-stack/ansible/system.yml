- name: Install maintained Ubuntu runtime packages without starting default listeners
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - unzip
      - docker.io
      - caddy
      - e2fsprogs
      - iptables-persistent
    state: present
    update_cache: true
    cache_valid_time: 3600
    policy_rc_d: 101

- name: Create the system Docker CLI plugin directory
  ansible.builtin.file:
    path: /usr/local/lib/docker/cli-plugins
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Compose with explicit false bind options in its JSON output
  ansible.builtin.get_url:
    url: "https://github.com/docker/compose/releases/download/v{{ recount_compose_version }}/docker-compose-linux-aarch64"
    dest: /usr/local/lib/docker/cli-plugins/docker-compose
    checksum: "sha256:{{ recount_compose_sha256 }}"
    owner: root
    group: root
    mode: "0755"

- name: Verify the selected Compose version
  ansible.builtin.command:
    argv: [docker, compose, version, --short]
  register: recount_installed_compose
  changed_when: false
  failed_when: recount_installed_compose.stdout != recount_compose_version

- name: Create root-owned deployment directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - /opt/recount
    - /opt/recount/bootstrap
    - /opt/recount/releases
    - /etc/recount

- name: Download the project-pinned native Bun runtime
  ansible.builtin.get_url:
    url: "https://github.com/oven-sh/bun/releases/download/bun-v{{ recount_bun_version }}/bun-linux-aarch64.zip"
    dest: /opt/recount/bootstrap/bun.zip
    checksum: "sha256:{{ recount_bun_sha256 }}"
    owner: root
    group: root
    mode: "0600"

- name: Extract the native Bun runtime
  ansible.builtin.unarchive:
    src: /opt/recount/bootstrap/bun.zip
    dest: /opt/recount/bootstrap
    remote_src: true
    creates: /opt/recount/bootstrap/bun-linux-aarch64/bun

- name: Install Bun in a root-owned executable path
  ansible.builtin.copy:
    src: /opt/recount/bootstrap/bun-linux-aarch64/bun
    dest: /usr/local/bin/bun
    remote_src: true
    owner: root
    group: root
    mode: "0755"

- name: Verify the selected Bun version
  ansible.builtin.command:
    argv: [/usr/local/bin/bun, --version]
  register: recount_installed_bun
  changed_when: false
  failed_when: recount_installed_bun.stdout != recount_bun_version

- name: Remove the retired Run Command receiver and its sudo rule
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/sudoers.d/recount-release
    - /usr/local/sbin/recount-release
    - /opt/recount/bootstrap/install-sudoers.sh
    - /opt/recount/bootstrap/sudoers

- name: Create the CD deployment user
  ansible.builtin.user:
    name: recount-deploy
    shell: /bin/bash
    groups: []
    create_home: true

- name: Authorize only the CD deployment key
  ansible.posix.authorized_key:
    user: recount-deploy
    key: "{{ recount_deploy_public_key }}"
    exclusive: true

# Ansible deploys need privilege escalation; the key lives only in the protected
# GitHub environment, and every deployment requires its approval.
- name: Allow the CD deployment user to escalate without a password
  ansible.builtin.copy:
    content: "recount-deploy ALL=(ALL) NOPASSWD: ALL\n"
    dest: /etc/sudoers.d/recount-deploy
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Configure the public release repository
  ansible.builtin.copy:
    content: "{{ recount_repository }}\n"
    dest: /etc/recount/repository
    owner: root
    group: root
    mode: "0600"
