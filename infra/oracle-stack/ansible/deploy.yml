- name: Activate an attested release on the Oracle stack
  hosts: recount_ingestion
  become: true
  gather_facts: true
  vars:
    recount_release_directory: "/opt/recount/releases/{{ recount_release }}"
  tasks:
    - name: Require a release built for this host
      ansible.builtin.assert:
        that:
          - recount_release is match("^[a-f0-9]{40}-[0-9]+-[0-9]+$")
          - recount_release_sha256 is match("^[a-f0-9]{64}$")
          - recount_release_archive is match("^/")
          - (recount_arch, ansible_facts.architecture) in [("arm64", "aarch64"), ("amd64", "x86_64")]
        quiet: true

    - name: Create the release directory
      ansible.builtin.file:
        path: "{{ recount_release_directory }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    # The runner verified this archive's build attestation and passes its digest.
    - name: Upload the attested release archive
      ansible.builtin.copy:
        src: "{{ recount_release_archive }}"
        dest: "{{ recount_release_directory }}/release.tar"
        owner: root
        group: root
        mode: "0600"

    - name: Measure the uploaded archive
      ansible.builtin.stat:
        path: "{{ recount_release_directory }}/release.tar"
        checksum_algorithm: sha256
      register: recount_archive

    - name: Require the attested archive digest
      ansible.builtin.assert:
        that: recount_archive.stat.checksum == recount_release_sha256
        quiet: true

    - name: Extract the release
      ansible.builtin.unarchive:
        src: "{{ recount_release_directory }}/release.tar"
        dest: "{{ recount_release_directory }}"
        remote_src: true
        creates: "{{ recount_release_directory }}/activate.sh"

    - name: Read the release identity
      ansible.builtin.slurp:
        src: "{{ recount_release_directory }}/{{ item }}"
      loop: [release, arch]
      register: recount_identity

    - name: Require the archive to describe this release
      ansible.builtin.assert:
        that:
          - (recount_identity.results[0].content | b64decode | trim) == recount_release
          - (recount_identity.results[1].content | b64decode | trim) == recount_arch
        quiet: true

    - name: Require plain runtime settings
      ansible.builtin.assert:
        that:
          - recount_posthog_project_token | default('') is match("^[A-Za-z0-9_-]*$")
          - recount_posthog_host | default('') is match("^(https://[A-Za-z0-9.-]+(:[0-9]+)?)?$")
          - recount_landing_origin | default('') is match("^(https://[A-Za-z0-9.-]+(:[0-9]+)?)?$")
        quiet: true

    # Runtime settings, so the same release can be promoted between environments.
    # An empty value removes the setting, which turns that feature off.
    - name: Configure the web application's runtime settings
      ansible.builtin.lineinfile:
        path: /etc/recount/ingestion.env
        regexp: "^{{ item.key }}="
        line: '{{ item.key }}="{{ item.value }}"'
        state: "{{ 'present' if item.value else 'absent' }}"
      loop: "{{ recount_runtime | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      vars:
        recount_runtime:
          RECOUNT_POSTHOG_PROJECT_TOKEN: "{{ recount_posthog_project_token | default('') }}"
          RECOUNT_POSTHOG_HOST: "{{ recount_posthog_host | default('') }}"
          RECOUNT_LANDING_ORIGIN: "{{ recount_landing_origin | default('') }}"

    - name: Activate the release
      ansible.builtin.command:
        argv:
          [
            bash,
            "{{ recount_release_directory }}/activate.sh",
            "{{ recount_release_directory }}",
          ]
      register: recount_activation
      changed_when: true

    - name: Report the activation
      ansible.builtin.debug:
        msg: "{{ recount_activation.stdout_lines | last }}"

    - name: Render the protected heartbeat configuration when supplied
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.env', 'RECOUNT_BETTERSTACK_HEARTBEATS') }}"
        dest: /etc/recount/betterstack-heartbeats.env
        owner: root
        group: root
        mode: "0600"
        validate: "/usr/bin/python3 {{ recount_release_directory }}/monitoring/heartbeats.py validate %s"
      when: lookup('ansible.builtin.env', 'RECOUNT_BETTERSTACK_HEARTBEATS') | length > 0
      no_log: true
      diff: false

    - name: Install the heartbeat units from the attested release
      ansible.builtin.copy:
        src: "{{ recount_release_directory }}/monitoring/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      loop:
        - recount-heartbeats@.service
        - recount-heartbeats-components.timer
        - recount-heartbeats-pipeline.timer

    - name: Enable and start the heartbeat timers
      ansible.builtin.systemd_service:
        name: "recount-heartbeats-{{ item }}.timer"
        daemon_reload: true
        enabled: true
        state: started
      loop: [components, pipeline]
