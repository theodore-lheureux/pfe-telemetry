name: recount-ingestion-monitoring

x-restrictions: &restrictions
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  pids_limit: 128
  logging:
    driver: json-file
    options: { max-size: 2m, max-file: "3" }

services:
  host-metrics:
    <<: *restrictions
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    entrypoint: [/bin/busybox, httpd, -f, -p, "9101", -h, /export]
    user: "65534:65534"
    volumes:
      - type: bind
        source: ${RECOUNT_MONITORING_HOST_METRICS_DIRECTORY:-/var/lib/recount/monitoring}
        target: /export
        read_only: true
        bind: { create_host_path: false }
    cpus: 0.05
    mem_limit: 32m
    networks: [scrape]

  kafka-exporter:
    <<: *restrictions
    image: danielqsj/kafka-exporter:v1.9.0@sha256:4150e46b2e9697ac30e4be8de03ec1704b4bdc7037577b83b8d35a32be298c16
    command:
      - --kafka.server=kafka:9092
      - --topic.filter=^recount\.(metrics\.(raw|normalized|late)|participants)$$
      - --group.filter=^(recount-normalizer|recount-clickhouse(-late|-participants)?)$$
      - --offset.show-all
    cpus: 0.2
    mem_limit: 96m
    networks: [scrape, broker]

  prometheus:
    <<: *restrictions
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=128MB
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    cpus: 0.25
    mem_limit: 192m
    networks: [scrape, ui]

  grafana:
    <<: *restrictions
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    ports: ["127.0.0.1:${RECOUNT_MONITORING_GRAFANA_PORT:-3003}:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/recount-dashboards/ingestion.json
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/etc/recount-dashboards:ro
      - grafana-data:/var/lib/grafana
    tmpfs:
      - /tmp:size=64m,mode=1777
    cpus: 0.35
    mem_limit: 384m
    networks: [ui]
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:3000/api/health]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

networks:
  broker:
    external: true
    name: ${RECOUNT_MONITORING_BROKER_NETWORK:-recount-ingestion_broker}
  scrape:
    internal: true
  ui: {}

volumes:
  prometheus-data:
  grafana-data:
