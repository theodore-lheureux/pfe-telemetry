services:
  postgres:
    mem_limit: 1024m
    memswap_limit: 1024m
  kafka:
    mem_limit: 1536m
    memswap_limit: 1536m
    environment:
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
  clickhouse:
    mem_limit: 8192m
    memswap_limit: 8192m
    # The app services freed CPU; ClickHouse was throttled 25% at 45 nodes under 2 cores.
    cpus: 3
    volumes:
      - type: bind
        source: ../oracle-stack/deploy/clickhouse-memory.xml
        target: /etc/clickhouse-server/config.d/zz-deployment-memory.xml
        read_only: true
        bind: { create_host_path: false }
  ingestion-api:
    image: ${RECOUNT_INGESTION_IMAGE:?Select the release ingestion image}
    mem_limit: 1024m
    memswap_limit: 1024m
  normalizer:
    image: ${RECOUNT_NORMALIZER_IMAGE:?Select the release normalizer image}
    environment:
      RECOUNT_NORMALIZER_METRICS_FILE: /run/recount-metrics/normalizer.prom
    tmpfs:
      - /run/recount-metrics:rw,nosuid,nodev,noexec,size=64k,uid=10001,gid=10001,mode=0700
    deploy:
      replicas: ${RECOUNT_NORMALIZER_REPLICAS:-3}
    mem_limit: 1024m
    memswap_limit: 1024m
  web:
    image: ${RECOUNT_WEB_IMAGE:?Select the release web image}
    environment:
      BETTER_AUTH_URL: https://app.recount.cloud
    mem_limit: 1024m
    memswap_limit: 1024m
  live:
    image: ${RECOUNT_WEB_IMAGE:?Select the release web image}
