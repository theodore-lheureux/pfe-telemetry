name: Integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  LEFTHOOK: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  authority:
    name: Authority, database and normalizer Kafka
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TEST_DATABASE_URL: postgresql://recount:recount-ci-only@127.0.0.1:5432/recount
      RECOUNT_NORMALIZER_TEST_ALLOW_PUBLISH: "1"
      RECOUNT_NORMALIZER_TEST_BROKER: localhost:9092
      RECOUNT_NORMALIZER_TEST_NAMESPACE: recount.ci.${{ github.run_id }}.${{ github.run_attempt }}
      RECOUNT_NORMALIZER_TEST_RAW_TOPIC: recount.ci.${{ github.run_id }}.${{ github.run_attempt }}.normalizer.raw
      RECOUNT_NORMALIZER_TEST_NORMALIZED_TOPIC: recount.ci.${{ github.run_id }}.${{ github.run_attempt }}.normalizer.normalized
      RECOUNT_NORMALIZER_TEST_GROUP: recount.ci.${{ github.run_id }}.${{ github.run_attempt }}.normalizer.group
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
        env:
          POSTGRES_USER: recount
          POSTGRES_DB: recount
          POSTGRES_PASSWORD: recount-ci-only
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready --host=127.0.0.1 --username=recount --dbname=recount"
          --health-interval=5s --health-timeout=5s --health-retries=12
      kafka:
        image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
        ports: [9092:9092]
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
          KAFKA_MESSAGE_MAX_BYTES: 6291456
          KAFKA_REPLICA_FETCH_MAX_BYTES: 6291456
          KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
        options: >-
          --memory=768m
          --health-cmd="/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval=10s --health-timeout=10s --health-retries=12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: bun --no-env-file install --frozen-lockfile --ignore-scripts
      - run: bun run i18n:compile
      - run: psql --version
      - run: bun --no-env-file test --timeout 30000 apps/web/tests/integration
      - name: Real PostgreSQL authority, rotation, revocation, expiry and outage
        run: cargo test --locked -p recount-ingestion-api --lib tests::live::authoritative_postgres_rotation_revocation_expiry_bindings_and_outage_are_live -- --ignored --exact --nocapture
      - name: Create this job's empty normalizer topics
        run: |
          docker exec '${{ job.services.kafka.id }}' /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --create --topic "$RECOUNT_NORMALIZER_TEST_RAW_TOPIC" --partitions 3 --replication-factor 1 --config max.message.bytes=6291456
          docker exec '${{ job.services.kafka.id }}' /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --create --topic "$RECOUNT_NORMALIZER_TEST_NORMALIZED_TOPIC" --partitions 3 --replication-factor 1 --config max.message.bytes=2097152
      - name: Real normalizer progress, bootstrap, replay, rebalance and poison
        run: cargo test --locked -p recount-normalizer --test kafka -- --ignored --test-threads=1 --nocapture

  browser:
    name: Host Node browser and native Bun web
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      TEST_DATABASE_URL: postgresql://recount:recount-ci-only@127.0.0.1:5432/recount
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
        env:
          POSTGRES_USER: recount
          POSTGRES_DB: recount
          POSTGRES_PASSWORD: recount-ci-only
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready --host=127.0.0.1 --username=recount --dbname=recount"
          --health-interval=5s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: bun --no-env-file install --frozen-lockfile --ignore-scripts
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: bun run --filter @recount/web build
      - name: Mutation lifecycle regressions
        run: node node_modules/@playwright/test/cli.js test --config apps/web/tests/unit/mutation-lifecycle.playwright.ts
      - name: Generated Bun server and same-resource cleanup
        run: bun --no-env-file test tests/runtime/native-web.test.ts
      - name: Production build browser assertions
        env:
          RECOUNT_BROWSER_BUILT: "true"
        run: node node_modules/@playwright/test/cli.js test --config apps/web/playwright.config.ts
      - name: Development RPC discovery
        run: node node_modules/@playwright/test/cli.js test --config apps/web/playwright.config.ts administration-lifecycle.spec.ts --grep 'retains the exact login return'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failures
          path: apps/web/test-results
          retention-days: 7

  native-runtime:
    name: Native storage, packaged runtime and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      COMPOSE_PROJECT_NAME: recount-ci-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: ${{ github.workspace }}/infra/local/compose.yaml
      COMPOSE_ENV_FILES: ${{ github.workspace }}/infra/local/.env.example
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
      RECOUNT_ARTIFACT_ARCH: amd64
      POSTGRES_PASSWORD: recount-ci-only
      CLICKHOUSE_ADMIN_PASSWORD: recount-ci-admin-only
      CLICKHOUSE_READER_PASSWORD: recount-ci-reader-only
      RECOUNT_SCHEMA_DIRECTORY: ${{ github.workspace }}/.state/ci/schema
      RECOUNT_CLICKHOUSE_IMAGE: recount-ci-clickhouse:128
      RECOUNT_POSTGRES_PORT: "15432"
      RECOUNT_KAFKA_HOST_PORT: "19092"
      RECOUNT_CLICKHOUSE_PORT: "18123"
      TEST_DATABASE_URL: postgresql://recount:recount-ci-only@127.0.0.1:15432/recount?sslmode=disable
      RECOUNT_CLICKHOUSE_TEST_URL: http://127.0.0.1:18123
      RECOUNT_CLICKHOUSE_TEST_USER: telemetry_admin
      RECOUNT_CLICKHOUSE_TEST_PASSWORD: recount-ci-admin-only
      RECOUNT_CLICKHOUSE_TEST_READER_PASSWORD: recount-ci-reader-only
      RECOUNT_CLICKHOUSE_URL: http://127.0.0.1:18123
      RECOUNT_CLICKHOUSE_READER_PASSWORD: recount-ci-reader-only
      RECOUNT_RAW_TOPIC: recount.ci.${{ github.run_id }}.${{ github.run_attempt }}.pipeline.raw
      RECOUNT_NORMALIZED_TOPIC: recount.ci.${{ github.run_id }}.${{ github.run_attempt }}.pipeline.normalized
      RECOUNT_NORMALIZER_GROUP: recount.ci.${{ github.run_id }}.${{ github.run_attempt }}.pipeline.normalizer
      RECOUNT_STORAGE_TEST_ALLOW_CREATE: "1"
      RECOUNT_STORAGE_TEST_NAMESPACE: recount.ci.${{ github.run_id }}.${{ github.run_attempt }}
      RECOUNT_STORAGE_TEST_BROKER: 127.0.0.1:19092
      RECOUNT_STORAGE_TEST_INTERNAL_BROKER: kafka:9092
      RECOUNT_STORAGE_TEST_OUTPUT_ROWS: "128"
      RECOUNT_STORAGE_TEST_ALLOW_RESTART: "1"
      RECOUNT_STORAGE_TEST_SYNTHETIC_ALLOCATION: "1"
      RECOUNT_RUNTIME_TEST_ALLOW_CONTAINERS: "1"
      RECOUNT_RUNTIME_COLLECTOR_IMAGE: recount-collector:local
      RECOUNT_RUNTIME_INGESTION_API_IMAGE: recount-ingestion-api:local
      RECOUNT_RUNTIME_NORMALIZER_IMAGE: recount-normalizer:local
      RECOUNT_RUNTIME_WEB_IMAGE: recount-web:local
      RECOUNT_PIPELINE_COLLECTOR_IMAGE: recount-collector:local
      RECOUNT_PIPELINE_INGESTION_API_IMAGE: recount-ingestion-api:local
      RECOUNT_PIPELINE_NORMALIZER_IMAGE: recount-normalizer:local
      RECOUNT_PIPELINE_ISOLATED: "true"
      RECOUNT_PIPELINE_RESTART_CLICKHOUSE: "true"
      RECOUNT_BROWSER_BUILT: "true"
      RECOUNT_MAX_REQUEST_BYTES: "4194304"
      RECOUNT_MAX_POINTS: "16384"
      RECOUNT_MAX_EXPANDED_ITEMS: "262144"
      RECOUNT_MAX_AUTHORITIES: "256"
      RECOUNT_MAX_ATTRIBUTE_NODES: "128"
      RECOUNT_NORMALIZED_MAX_RECORD_BYTES: "1048576"
      RECOUNT_NORMALIZED_MAX_OUTPUT_BYTES: "16777216"
      RECOUNT_RAW_BROKER_MAX_BYTES: "6291456"
      RECOUNT_NORMALIZED_BROKER_MAX_BYTES: "2097152"
      RECOUNT_NORMALIZER_OUTPUT_ROWS: "128"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: native-runtime-x86_64-unknown-linux-gnu
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: bun --no-env-file install --frozen-lockfile --ignore-scripts
      - name: Build application artifacts on the Linux host
        run: |
          just build
          mkdir -p .state/ci
          cargo build --locked --release --target "$CARGO_BUILD_TARGET" --workspace --bins --examples --message-format=json > .state/ci/build.jsonl
          cargo test --locked --release --target "$CARGO_BUILD_TARGET" -p recount-normalizer --test storage --no-run
          bun --no-env-file tests/ci/stage-artifacts.ts "$RECOUNT_ARTIFACT_ARCH" .state/ci/build.jsonl
      - name: Prepare and package the trusted native schema
        run: |
          cargo run --locked --release --target "$CARGO_BUILD_TARGET" -p recount-telemetry-validation --example recount-schema-export -- --source-root . --output "$RECOUNT_SCHEMA_DIRECTORY" --bootstrap kafka:9092
          docker build --file infra/clickhouse/Dockerfile --tag "$RECOUNT_CLICKHOUSE_IMAGE" "$RECOUNT_SCHEMA_DIRECTORY"
      - name: Package only prebuilt application artifacts with Bake
        run: just --no-dotenv local package "$RECOUNT_ARTIFACT_ARCH"
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Explicitly initialize one fresh job-owned backend stack
        run: bash tests/ci/initialize-backends.sh
      - name: Bind fault authority to the actual initialized container
        run: bun --no-env-file tests/ci/runtime-settings.ts
      - name: Native point fidelity, replay, poison, missing and expired checkpoints, fanout and sparse flush
        run: just --no-dotenv test-integration storage --release
      - name: Real HTTP reader, exact values, cancellation, capacity and SELECT-only grants
        run: just --no-dotenv test-integration telemetry
      - name: Image-pinned schema and packaged application smoke assertions
        run: just --no-dotenv test-runtime
      - name: Owned unclean restart, checkpoint replay and invalid initialized startup
        run: just --no-dotenv test-recovery --release
      - name: Packaged Linux collectors through API, normalizer, storage and authorized English/French browser
        run: just --no-dotenv test-integration pipeline
      - name: Require the stopped producer pipeline to leave no pending native input
        timeout-minutes: 2
        run: |
          drained=false
          for attempt in {1..20}; do
            echo "Checking owned native consumer drain ($attempt/20)"
            offsets=$(docker compose exec -T kafka /opt/kafka/bin/kafka-consumer-groups.sh --bootstrap-server kafka:9092 --group recount-clickhouse --describe)
            if awk -v topic="$RECOUNT_NORMALIZED_TOPIC" '$1=="recount-clickhouse" && $2==topic {count++; if ($6!="0") bad=1} END {exit !(count==3 && !bad)}' <<< "$offsets"; then
              drained=true
              break
            fi
            sleep 1
          done
          [[ $drained == true ]] || { echo 'Pending normalized input prevents lowering the native row bound' >&2; exit 1; }
      - name: Verify the smaller prepared finite bound on the same preserved data
        env:
          RECOUNT_SCHEMA_DIRECTORY: ${{ github.workspace }}/.state/ci/schema64
          RECOUNT_CLICKHOUSE_IMAGE: recount-ci-clickhouse:64
          RECOUNT_NORMALIZER_OUTPUT_ROWS: "64"
          RECOUNT_STORAGE_TEST_OUTPUT_ROWS: "64"
        run: |
          docker compose stop --timeout 60 clickhouse
          cargo run --locked --release --target "$CARGO_BUILD_TARGET" -p recount-telemetry-validation --example recount-schema-export -- --source-root . --output "$RECOUNT_SCHEMA_DIRECTORY" --bootstrap kafka:9092
          docker build --file infra/clickhouse/Dockerfile --tag "$RECOUNT_CLICKHOUSE_IMAGE" "$RECOUNT_SCHEMA_DIRECTORY"
          docker compose up --no-build --no-deps --detach --wait --wait-timeout 180 clickhouse
          cargo test --locked --release -p recount-normalizer --test storage complete_records_have_finite_fanout_and_oversized_records_do_not_commit -- --ignored --exact --nocapture
      - name: Owned backend diagnostics
        if: always()
        run: docker compose logs --no-color --tail 80 postgres kafka clickhouse
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: pipeline-failures
          path: apps/web/test-results/pipeline
          retention-days: 7
      - name: Stop only this job's backend processes; preserve volumes and images
        if: always()
        run: docker compose stop --timeout 60 postgres kafka clickhouse
