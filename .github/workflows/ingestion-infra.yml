name: Ingestion infrastructure CD

on:
  pull_request:
    paths:
      [
        "infra/oci-ingestion/**",
        "infra/ci/**",
        ".github/workflows/ingestion-infra.yml",
        ".github/actions/ingestion-infra-setup/**",
      ]
  push:
    branches: [main]
    paths:
      [
        "infra/oci-ingestion/**",
        "infra/ci/**",
        ".github/workflows/ingestion-infra.yml",
        ".github/actions/ingestion-infra-setup/**",
      ]
  workflow_dispatch:
    inputs:
      apply:
        description: Apply this run's reviewed, encrypted plan after environment approval
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ingestion-infrastructure
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 infra/ci/public_logs.py mask
      - uses: opentofu/setup-opentofu@e95ccdd20623115bfd7d47df14a3250d6066a9d0 # v1.0.7
        with:
          tofu_version: 1.13.9
          tofu_wrapper: false
      - run: |
          tofu -chdir=infra/oci-ingestion init -backend=false -input=false -lockfile=readonly
          tofu -chdir=infra/oci-ingestion fmt -check -recursive
          tofu -chdir=infra/oci-ingestion validate
          tofu -chdir=infra/oci-ingestion test
          python3 -m unittest discover -s infra/oci-ingestion/ci -p 'test_*.py'
          python3 -m unittest discover -s infra/ci -p 'test_*.py'

  plan:
    needs: check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment: ingestion-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_STATE_SECRET_ACCESS_KEY }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_STATE_BUCKET: ${{ secrets.AWS_STATE_BUCKET }}
      OCI_API_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
      OCI_API_KEY_FINGERPRINT: ${{ secrets.OCI_API_KEY_FINGERPRINT }}
      OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
      OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
      INGESTION_TFVARS_JSON: ${{ secrets.INGESTION_TFVARS_JSON }}
      PLAN_ENCRYPTION_KEY: ${{ secrets.PLAN_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The reviewed checkout is intentional; pinned actionlint lacks $/ syntax.
      - uses: ./.github/actions/ingestion-infra-setup # zizmor: ignore[self-repository]
      - name: Plan with native S3 locking
        run: |
          python3 infra/ci/public_logs.py plan infra/oci-ingestion
          test -n "$PLAN_ENCRYPTION_KEY"
          printf '%s' "$PLAN_ENCRYPTION_KEY" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --output infra/oci-ingestion/deployment.tfplan.gpg infra/oci-ingestion/deployment.tfplan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ingestion-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: infra/oci-ingestion/deployment.tfplan.gpg
          retention-days: 1
          if-no-files-found: error
      - name: Remove plaintext plan and credentials
        if: always()
        run: rm -f infra/oci-ingestion/deployment.tfplan "$HOME/.oci/config" "$HOME/.oci/deployment.pem"

  apply:
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.apply && github.ref == 'refs/heads/main'
    environment: ingestion-infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_STATE_SECRET_ACCESS_KEY }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_STATE_BUCKET: ${{ secrets.AWS_STATE_BUCKET }}
      OCI_API_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
      OCI_API_KEY_FINGERPRINT: ${{ secrets.OCI_API_KEY_FINGERPRINT }}
      OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
      OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
      INGESTION_TFVARS_JSON: ${{ secrets.INGESTION_TFVARS_JSON }}
      PLAN_ENCRYPTION_KEY: ${{ secrets.PLAN_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The reviewed checkout is intentional; pinned actionlint lacks $/ syntax.
      - uses: ./.github/actions/ingestion-infra-setup # zizmor: ignore[self-repository]
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ingestion-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: infra/oci-ingestion
      - name: Apply exactly the reviewed plan
        run: |
          test -n "$PLAN_ENCRYPTION_KEY"
          printf '%s' "$PLAN_ENCRYPTION_KEY" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --decrypt --output infra/oci-ingestion/deployment.tfplan \
            infra/oci-ingestion/deployment.tfplan.gpg
          python3 infra/ci/public_logs.py apply infra/oci-ingestion
      - name: Remove plaintext plan and credentials
        if: always()
        run: rm -f infra/oci-ingestion/deployment.tfplan "$HOME/.oci/config" "$HOME/.oci/deployment.pem"
