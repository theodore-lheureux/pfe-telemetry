name: Release · deploy to Oracle

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release identifier (commit-run-attempt, without the release- prefix)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ingestion-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: ingestion-deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      attestations: read
    env:
      RELEASE: ${{ inputs.release }}
      ARCH: ${{ vars.OCI_INGESTION_ARCH }}
      DEPLOY_HOST: app.recount.cloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
      - name: Verify native build provenance before authorizing root execution
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [[ $RELEASE =~ ^[a-f0-9]{40}-[0-9]+-[0-9]+$ && $ARCH =~ ^(arm64|amd64)$ ]]
          [[ $(gh api "repos/$GH_REPO" --jq .private) == false ]]
          gh release download "release-$RELEASE" --dir assets --pattern "recount-stack-$ARCH.tar.gz"
          archive="assets/recount-stack-$ARCH.tar.gz"
          gh attestation verify "$archive" --repo "$GH_REPO" \
            --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
            --source-ref refs/heads/main --source-digest "${RELEASE%%-*}" \
            --deny-self-hosted-runners
          (cd assets && sha256sum "recount-stack-$ARCH.tar.gz" > "recount-stack-$ARCH.tar.gz.sha256")
      - name: Install the pinned deployment key and host key
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy" "$HOME/.ssh/known_hosts"
      - name: Activate the release with Ansible
        env:
          ANSIBLE_CONFIG: infra/oracle-stack/ansible/ansible.cfg
          ANSIBLE_HOST_KEY_CHECKING: "true"
          REPOSITORY: ${{ github.repository }}
        run: |
          digest=$(cut -d' ' -f1 "assets/recount-stack-$ARCH.tar.gz.sha256")
          printf '[recount_ingestion]\n%s\n' "$DEPLOY_HOST" > "$RUNNER_TEMP/inventory.ini"
          uv run --locked ansible-playbook infra/oracle-stack/ansible/deploy.yml \
            --inventory "$RUNNER_TEMP/inventory.ini" \
            --user recount-deploy --private-key "$HOME/.ssh/deploy" \
            --extra-vars "recount_release=$RELEASE recount_arch=$ARCH recount_release_sha256=$digest recount_repository=$REPOSITORY"
      - name: Remove this runner's deployment key
        if: always()
        run: rm -f "$HOME/.ssh/deploy"
