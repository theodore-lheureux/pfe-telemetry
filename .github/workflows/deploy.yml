name: Release · deploy to Oracle

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release identifier (commit-run-attempt, without the release- prefix)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ingestion-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: ingestion-deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      attestations: read
    env:
      RELEASE: ${{ inputs.release }}
      ARCH: ${{ vars.OCI_INGESTION_ARCH }}
      OCI_API_KEY_FINGERPRINT: ${{ secrets.OCI_API_KEY_FINGERPRINT }}
      OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
      OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
      OCI_INSTANCE_ID: ${{ secrets.OCI_INSTANCE_ID }}
      OCI_COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 infra/ci/public_logs.py mask
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
      - run: uv tool install oci-cli==3.96.2
      - name: Verify native build provenance before authorizing root execution
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [[ $RELEASE =~ ^[a-f0-9]{40}-[0-9]+-[0-9]+$ && $ARCH =~ ^(arm64|amd64)$ ]]
          [[ $(gh api "repos/$GH_REPO" --jq .private) == false ]]
          gh release download "release-$RELEASE" --dir assets --pattern "recount-stack-$ARCH.tar.gz"
          archive="assets/recount-stack-$ARCH.tar.gz"
          gh attestation verify "$archive" --repo "$GH_REPO" \
            --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
            --source-ref refs/heads/main --source-digest "${RELEASE%%-*}" \
            --deny-self-hosted-runners
          (cd assets && sha256sum "recount-stack-$ARCH.tar.gz" > "recount-stack-$ARCH.tar.gz.sha256")
      - name: Materialize the scoped OCI deployment identity
        env:
          OCI_API_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
        run: python3 infra/oracle-stack/ci/credentials.py
      - name: Activate the release through OCI Run Command
        id: activate
        run: python3 infra/oracle-stack/ci/run-command.py
      - name: Show redacted host failure output
        if: failure() && steps.activate.outcome == 'failure'
        run: python3 infra/ci/public_logs.py host-failure
      - name: Remove this runner's deployment credential files
        if: always()
        run: rm -f "$HOME/.oci/config" "$HOME/.oci/deployment.pem" .state/oci-deploy-execution.json
