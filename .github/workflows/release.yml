name: Release · build and deploy

# Every push to main builds a release and deploys it after approval in the
# ingestion-deploy environment. Deploys do not wait for the test workflows.
on:
  push:
    branches: [main]
    paths-ignore:
      - "apps/landing/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      LEFTHOOK: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
      RELEASE: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"
      - run: rustup show active-toolchain
      # Release-only keys written only from main; the cache holds downloaded crates and
      # compiled dependencies, while workspace crates always rebuild from this commit.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2 zizmor: ignore[cache-poisoning]
        with:
          shared-key: release-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: bun --no-env-file install --frozen-lockfile --ignore-scripts
      - name: Compile on the native Linux host
        run: |
          bun run --filter @recount/web build
          mkdir -p .state
          cargo build --locked --release --workspace --bins --examples --message-format=json > .state/build.jsonl
          bun --no-env-file tests/ci/stage-artifacts.ts "$ARCH" .state/build.jsonl
          cargo run --locked --release -p recount-telemetry-validation --example recount-schema-export -- \
            --source-root . --output .state/release-schema --bootstrap kafka:9092
      - name: Package and check prebuilt binaries
        run: |
          just --no-dotenv local package "$ARCH" ingestion-api normalizer web
          docker run --rm --network none recount-ingestion-api:local --help
          docker run --rm --network none recount-normalizer:local --help
          bash infra/oracle-stack/deploy/package.sh "$ARCH" "$RELEASE"
          tar -czf ".state/recount-collector-$ARCH.tar.gz" -C ".state/artifacts/$ARCH/bin" recount-collector
          (cd .state && sha256sum "recount-collector-$ARCH.tar.gz" > "recount-collector-$ARCH.tar.gz.sha256")
      - name: Attest final native runtime and collector archives
        uses: actions/attest-build-provenance@e4d4f7c39adfa4c260fb5c147f0622000aa14b99 # v4.0.0
        with:
          subject-path: |
            .state/recount-stack-${{ matrix.arch }}.tar
            .state/recount-collector-${{ matrix.arch }}.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stack-${{ matrix.arch }}
          path: |
            .state/recount-stack-${{ matrix.arch }}.tar
            .state/recount-stack-${{ matrix.arch }}.tar.sha256
            .state/recount-collector-${{ matrix.arch }}.tar.gz
            .state/recount-collector-${{ matrix.arch }}.tar.gz.sha256
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: build
    environment: ingestion-deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # One deploy at a time; a newer push's deploy replaces one still awaiting approval.
    concurrency:
      group: ingestion-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      attestations: read
    env:
      RELEASE: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      ARCH: ${{ vars.OCI_INGESTION_ARCH }}
      DEPLOY_HOST: app.recount.cloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stack-${{ vars.OCI_INGESTION_ARCH }}
          path: assets
      - name: Verify native build provenance before authorizing root execution
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [[ $ARCH =~ ^(arm64|amd64)$ ]]
          gh attestation verify "assets/recount-stack-$ARCH.tar" --repo "$GH_REPO" \
            --signer-workflow "$GH_REPO/.github/workflows/release.yml" \
            --source-ref refs/heads/main --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners
      - name: Install the pinned deployment key and host key
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy" "$HOME/.ssh/known_hosts"
      - name: Activate the release with Ansible
        env:
          ANSIBLE_CONFIG: infra/oracle-stack/ansible/ansible.cfg
          ANSIBLE_HOST_KEY_CHECKING: "true"
          # Environment settings belong to the deployment, not the build.
          POSTHOG_PROJECT_TOKEN: ${{ vars.POSTHOG_PROJECT_TOKEN }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
        run: |
          archive="$PWD/assets/recount-stack-$ARCH.tar"
          digest=$(sha256sum "$archive" | cut -d' ' -f1)
          printf '[recount_ingestion]\n%s\n' "$DEPLOY_HOST" > "$RUNNER_TEMP/inventory.ini"
          uv run --locked ansible-playbook infra/oracle-stack/ansible/deploy.yml \
            --inventory "$RUNNER_TEMP/inventory.ini" \
            --user recount-deploy --private-key "$HOME/.ssh/deploy" \
            --extra-vars "recount_release=$RELEASE recount_arch=$ARCH recount_release_sha256=$digest recount_release_archive=$archive" \
            --extra-vars "$(jq -n '{recount_posthog_project_token: env.POSTHOG_PROJECT_TOKEN, recount_posthog_host: env.POSTHOG_HOST}')"
      - name: Remove this runner's deployment key
        if: always()
        run: rm -f "$HOME/.ssh/deploy"

  # Collectors and demo VMs install from published releases; production does not.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: stack-*
          merge-multiple: true
          path: assets
      - name: Publish only this run's build outputs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          COMMIT: ${{ github.sha }}
        # GitHub refuses a GITHUB_TOKEN tag on a commit whose workflow files differ
        # from main's, so only the run for main's latest commit publishes; an older
        # run's release would be superseded anyway.
        run: |
          latest=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [[ $latest != "$COMMIT" ]]; then
            echo "main has moved to $latest; that run publishes instead."
            exit 0
          fi
          cd assets
          sha256sum --check recount-*.sha256
          gh release create "release-$RELEASE" --target "$COMMIT" \
            --latest=false --prerelease \
            --title "Release $RELEASE" --notes "Native Linux arm64 and amd64 runtime bundles." \
            recount-stack-*.tar recount-stack-*.tar.sha256 \
            recount-collector-*.tar.gz recount-collector-*.tar.gz.sha256
