name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  LEFTHOOK: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  web:
    name: Web and shared configuration
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"
      - name: Restore Bun package downloads
        id: bun-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version') }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version') }}-
      - run: bun install --frozen-lockfile
      - run: just check-web check-docs build test-web db-check
      - name: Save Bun package downloads
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}

  rust:
    name: Rust and application integration
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgresql://pfe:pfe-ci-only@127.0.0.1:5432/pfe
      TELEMETRY_CLICKHOUSE_URL: http://127.0.0.1:18123
      TELEMETRY_CLICKHOUSE_PASSWORD: replace-local-writer-password
      TELEMETRY_CLICKHOUSE_READER_PASSWORD: replace-local-reader-password
    services:
      postgres:
        image: postgres:18.6-trixie@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
        env:
          POSTGRES_USER: pfe
          POSTGRES_DB: pfe
          POSTGRES_PASSWORD: pfe-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready --username=pfe --dbname=pfe"
          --health-interval=5s --health-timeout=5s --health-retries=12
      kafka:
        image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
        options: >-
          --memory=768m
          --health-cmd="/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval=10s --health-timeout=10s --health-retries=12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run i18n:compile
      - name: Start disposable ClickHouse with restricted runtime accounts
        run: docker compose --project-name pfe-ci-clickhouse --env-file infra/telemetry/.env.example --file infra/telemetry/compose.yaml up --detach --wait --wait-timeout 120 clickhouse
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"
      - name: Install Kafka client build dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends make g++
      - run: just check-rust test
      - name: Verify application database integration
        run: just test-db
      - name: Verify live credentials, ingestion and Kafka recovery
        run: cargo test --locked -p pfe-server --test credentials --test ingestion --test storage --test pipeline -- --ignored --test-threads=1
        timeout-minutes: 5
        env:
          TELEMETRY_KAFKA_BOOTSTRAP: localhost:9092
          PFE_TEST_CLICKHOUSE_TCP: 127.0.0.1:18123
      - name: Verify real ClickHouse query isolation and numeric semantics
        run: bun run --cwd apps/web test:telemetry
      - name: Verify shipped credential database provisioning
        run: bash tests/ingestion-provisioning.sh
        timeout-minutes: 3

  environment:
    name: Test environment
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.14.8"
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          prune-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"
      - run: uv sync --locked
      - run: just check-environment
