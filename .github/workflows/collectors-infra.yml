name: Collectors infrastructure CD

on:
  pull_request:
    paths:
      [
        "infra/aws-collectors/**",
        "infra/ci/**",
        ".github/workflows/collectors-infra.yml",
        ".github/actions/collectors-infra-setup/**",
      ]
  push:
    branches: [main]
    paths:
      [
        "infra/aws-collectors/**",
        "infra/ci/**",
        ".github/workflows/collectors-infra.yml",
        ".github/actions/collectors-infra-setup/**",
      ]
  workflow_dispatch:
    inputs:
      apply:
        description: Apply only after Oracle and the native HTTPS collector release are verified
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: collectors-infrastructure
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 infra/ci/public_logs.py mask
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: opentofu/setup-opentofu@e95ccdd20623115bfd7d47df14a3250d6066a9d0 # v1.0.7
        with:
          tofu_version: 1.13.9
          tofu_wrapper: false
      - run: |
          tofu -chdir=infra/aws-collectors init -backend=false -input=false -lockfile=readonly
          tofu -chdir=infra/aws-collectors fmt -check -recursive
          tofu -chdir=infra/aws-collectors validate
          tofu -chdir=infra/aws-collectors test
          python3 -m unittest discover -s infra/aws-collectors -p 'test_*.py'
          python3 -m unittest discover -s infra/ci -p 'test_*.py'
          ANSIBLE_CONFIG=infra/aws-collectors/ansible/ansible.cfg uv run --locked ansible-playbook \
            --syntax-check -i recount_collectors, infra/aws-collectors/ansible/collector.yml

  plan:
    needs: check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment: collectors-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      configured: ${{ steps.setup.outputs.configured }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_COLLECTORS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_COLLECTORS_SECRET_ACCESS_KEY }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_STATE_BUCKET: ${{ secrets.AWS_STATE_BUCKET }}
      COLLECTORS_TFVARS_JSON: ${{ secrets.COLLECTORS_TFVARS_JSON }}
      PLAN_ENCRYPTION_KEY: ${{ secrets.PLAN_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The reviewed checkout is intentional; pinned actionlint lacks $/ syntax.
      - uses: ./.github/actions/collectors-infra-setup # zizmor: ignore[self-repository]
        id: setup
      - name: Plan with native S3 locking
        if: steps.setup.outputs.configured == 'true'
        run: |
          python3 infra/ci/public_logs.py plan infra/aws-collectors
          test -n "$PLAN_ENCRYPTION_KEY"
          printf '%s' "$PLAN_ENCRYPTION_KEY" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --output infra/aws-collectors/deployment.tfplan.gpg infra/aws-collectors/deployment.tfplan
          echo 'Estimated running cost: USD 14.71/month for two collectors (730 hours), excluding transfer and taxes.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.setup.outputs.configured == 'true'
        with:
          name: collectors-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: infra/aws-collectors/deployment.tfplan.gpg
          retention-days: 1
          if-no-files-found: error
      - name: Remove plaintext plan
        if: always()
        run: rm -f infra/aws-collectors/deployment.tfplan

  apply:
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.apply && github.ref == 'refs/heads/main' && needs.plan.outputs.configured == 'true'
    environment: collectors-infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_COLLECTORS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_COLLECTORS_SECRET_ACCESS_KEY }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_STATE_BUCKET: ${{ secrets.AWS_STATE_BUCKET }}
      COLLECTORS_TFVARS_JSON: ${{ secrets.COLLECTORS_TFVARS_JSON }}
      PLAN_ENCRYPTION_KEY: ${{ secrets.PLAN_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The reviewed checkout is intentional; pinned actionlint lacks $/ syntax.
      - uses: ./.github/actions/collectors-infra-setup # zizmor: ignore[self-repository]
        id: setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.setup.outputs.configured == 'true'
        with:
          name: collectors-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: infra/aws-collectors
      - name: Apply exactly the reviewed plan
        if: steps.setup.outputs.configured == 'true'
        run: |
          test -n "$PLAN_ENCRYPTION_KEY"
          printf '%s' "$PLAN_ENCRYPTION_KEY" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --decrypt --output infra/aws-collectors/deployment.tfplan \
            infra/aws-collectors/deployment.tfplan.gpg
          python3 infra/ci/public_logs.py apply infra/aws-collectors
      - name: Remove plaintext plan
        if: always()
        run: rm -f infra/aws-collectors/deployment.tfplan
