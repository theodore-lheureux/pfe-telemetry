[package]
name = "recount-pipeline-load"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
ed25519-dalek = "3.0.0"
opentelemetry-proto = { version = "=0.33.1", default-features = false, features = ["gen-tonic", "metrics", "file-descriptors"] }
prost = { version = "=0.14.4", default-features = false, features = ["derive", "std"] }
rdkafka = { version = "=0.39.0", default-features = false, features = ["tokio", "zstd"] }
recount-telemetry-schema = { version = "0.1.0", path = "../../crates/telemetry-schema" }
recount-telemetry-validation = { version = "0.1.0", path = "../../crates/telemetry-validation" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "process", "sync", "time", "io-util"] }
tokio-postgres = "0.7.18"
tonic = { version = "=0.14.6", features = ["gzip"] }
tonic-health = "=0.14.6"
uuid = { version = "1.29.2", features = ["v7"] }
