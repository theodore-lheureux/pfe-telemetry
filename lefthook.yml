min_version: 2.1.17
glob_matcher: doublestar
lefthook: bun --bun run lefthook

# Check only: hooks do not format files or add unstaged changes to a commit.
pre-commit:
  parallel: true
  exclude:
    - apps/web/src/routeTree.gen.ts
    - bun.lock
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/.output/**"
    - "**/.tanstack/**"
    - "**/.venv/**"
    - "**/target/**"
    - "**/.state/**"
    - "**/.vagrant/**"
    - infra/lab/monitoring/grafana/dashboards/node-exporter-full.json
  jobs:
    - name: web-and-config
      glob: "**/*.{ts,tsx,json,jsonc,css}"
      run: bun --bun run biome check --no-errors-on-unmatched --error-on-warnings {staged_files}
    - name: documentation
      glob: "**/*.{md,yaml,yml}"
      run: bun --bun run prettier --check {staged_files}
    - name: just-format
      glob: "**/justfile"
      run: just check-justfiles
    - name: ansible-syntax
      glob: "infra/lab/ansible/**/*.yml"
      run: uv run --locked ansible-playbook --syntax-check --inventory compute, infra/lab/ansible/*.yml
    - name: rust-format
      glob:
        - "**/*.rs"
        - "**/Cargo.toml"
        - rust-toolchain.toml
      run: cargo fmt --all -- --check
    - name: vagrant-syntax
      glob: "infra/lab/Vagrantfile"
      run: ruby -c {staged_files}

# Compilation and type checks happen before pushing, rather than on every commit.
pre-push:
  parallel: true
  jobs:
    - name: types
      glob:
        - "infra/local/**/*.ts"
        - "tests/**"
        - "tooling/**"
        - "apps/web/**"
        - "apps/landing/**"
        - "packages/**"
        - package.json
        - bun.lock
      run: just typecheck check-tooling-types
    - name: rust-clippy
      glob:
        - "**/*.rs"
        - "**/Cargo.toml"
        - Cargo.lock
        - rust-toolchain.toml
      run: cargo clippy --locked --workspace --all-targets -- -D warnings
