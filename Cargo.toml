[workspace]
members = ["apps/collector", "apps/ingestion-api", "apps/normalizer", "crates/telemetry-schema", "crates/telemetry-validation"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
